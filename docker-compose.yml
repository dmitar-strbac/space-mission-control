services:
  postgres:
    image: postgres:16
    container_name: space-mission-postgres
    environment:
      POSTGRES_USER: space_admin
      POSTGRES_PASSWORD: space_admin
      POSTGRES_DB: space_mission_control
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U space_admin -d space_mission_control
      interval: 5s
      timeout: 5s
      retries: 10

  mongodb:
    image: mongo:7
    container_name: space-mission-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - db.adminCommand('ping').ok
      interval: 5s
      timeout: 5s
      retries: 10

  nats:
    image: nats:2
    container_name: space-mission-nats
    command:
      - "--jetstream"
      - "--store_dir=/data"
      - "--http_port=8222"
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - nats_data:/data
    healthcheck:
      test:
        - CMD
        - wget
        - --spider
        - -q
        - http://localhost:8222/healthz
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  mongodb_data:
  nats_data:
