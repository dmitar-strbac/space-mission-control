    restart: unless-stopped
    command:
      [
        "uvicorn",
        "app.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8002",
        "--reload",
      ]
    environment:
      SERVICE_NAME: vehicle-service
      SERVICE_TITLE: Vehicle Service
      ENVIRONMENT: ${ENVIRONMENT}
      LOG_LEVEL: ${LOG_LEVEL}
      NATS_URL: ${NATS_URL}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${VEHICLE_DATABASE_NAME}
    ports:
      - "8002:8002"
    volumes:
      - ./services/vehicle-service/app:/app/app
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
    networks:
      - mission-control-network

  trajectory-service:
    build:
      context: ./services/trajectory-service
    container_name: smc-trajectory-service
    restart: unless-stopped
    command:
      [
        "uvicorn",
        "app.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8003",
        "--reload",
      ]
    environment:
      SERVICE_NAME: trajectory-service
      SERVICE_TITLE: Trajectory Service
      ENVIRONMENT: ${ENVIRONMENT}
      LOG_LEVEL: ${LOG_LEVEL}
      NATS_URL: ${NATS_URL}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${TRAJECTORY_DATABASE_NAME}
    ports:
      - "8003:8003"
    volumes:
      - ./services/trajectory-service/app:/app/app
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
    networks:
      - mission-control-network

  flight-dynamics-service:
    build:
      context: ./services/flight-dynamics-service
    container_name: smc-flight-dynamics-service
    restart: unless-stopped
    command:
      [
        "uvicorn",
