        "--reload",
      ]
    environment:
      SERVICE_NAME: communication-service
      SERVICE_TITLE: Communication Service
      ENVIRONMENT: ${ENVIRONMENT}
      LOG_LEVEL: ${LOG_LEVEL}
      NATS_URL: ${NATS_URL}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${COMMUNICATION_DATABASE_NAME}
    ports:
      - "8005:8005"
    volumes:
      - ./services/communication-service/app:/app/app
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
