      ENVIRONMENT: ${ENVIRONMENT}
      LOG_LEVEL: ${LOG_LEVEL}
      NATS_URL: ${NATS_URL}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${FLIGHT_DYNAMICS_DATABASE_NAME}
    ports:
      - "8004:8004"
    volumes:
      - ./services/flight-dynamics-service/app:/app/app
    depends_on:
