      - mission-control-network

  telemetry-safety-service:
    build:
      context: ./services/telemetry-safety-service
    container_name: smc-telemetry-safety-service
    restart: unless-stopped
    command:
      [
        "uvicorn",
        "app.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8006",
        "--reload",
      ]
    environment:
      SERVICE_NAME: telemetry-safety-service
      SERVICE_TITLE: Telemetry & Safety Service
      ENVIRONMENT: ${ENVIRONMENT}
      LOG_LEVEL: ${LOG_LEVEL}
      NATS_URL: ${NATS_URL}
      DATABASE_URL: mongodb://${MONGO_INITDB_ROOT_USERNAME}:${MONGO_INITDB_ROOT_PASSWORD}@mongodb:27017/${TELEMETRY_DATABASE_NAME}?authSource=admin
    ports:
      - "8006:8006"
    volumes:
      - ./services/telemetry-safety-service/app:/app/app
    depends_on:
      mongodb:
        condition: service_healthy
      nats:
        condition: service_healthy
    networks:
      - mission-control-network

  frontend:
    build:
      context: ./frontend
    container_name: smc-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - mission-control-network

networks:
  mission-control-network:
    name: mission-control-network
    driver: bridge

volumes:
  postgres-data:
  mongo-data:
  nats-data:
